name: PR Agent Cost

# Disparado cuando termina el workflow "PR Agent", para tener acceso a los logs.
on:
  workflow_run:
    workflows: ["PR Agent"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  post_cost:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Precios gpt-5.5 (USD por 1M tokens). Ajustar si cambia el modelo.
      INPUT_PRICE_PER_1M: "5"
      OUTPUT_PRICE_PER_1M: "30"
      MODEL_NAME: "gpt-5.5"
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download run logs and extract usage
        run: |
          set -uo pipefail

          if ! gh api "repos/${REPO}/actions/runs/${RUN_ID}/logs" > logs.zip 2>/dev/null; then
            echo "No se pudieron descargar los logs del run ${RUN_ID}."
            exit 0
          fi

          mkdir -p logs && unzip -q -o logs.zip -d logs

          # Sumamos prompt/completion de todas las llamadas LLM del run.
          # `sort -u` deduplica usage objects (pr-agent loggea cada uno dos veces, INFO + DEBUG).
          read PROMPT COMPLETION < <(grep -rh -oE '"usage": ?\{[^}]+\}' logs 2>/dev/null | sort -u | \
            awk '
              {
                if (match($0, /"prompt_tokens": *[0-9]+/))     { s = substr($0, RSTART, RLENGTH); gsub(/[^0-9]/, "", s); tp += s }
                if (match($0, /"completion_tokens": *[0-9]+/)) { s = substr($0, RSTART, RLENGTH); gsub(/[^0-9]/, "", s); tc += s }
              }
              END { printf "%d %d\n", tp+0, tc+0 }
            ')

          echo "Prompt tokens: ${PROMPT:-0}"
          echo "Completion tokens: ${COMPLETION:-0}"

          if [ -z "${PROMPT:-}" ] || [ "$PROMPT" = "0" ]; then
            echo "No se encontró usage en los logs, salto el comentario."
            exit 0
          fi

          COST=$(awk -v p="$PROMPT" -v c="$COMPLETION" -v pi="$INPUT_PRICE_PER_1M" -v po="$OUTPUT_PRICE_PER_1M" \
            'BEGIN { printf "%.5f", (p*pi + c*po) / 1000000 }')

          # Buscar el número de PR a partir del branch.
          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No se encontró PR abierto para el branch ${HEAD_BRANCH}."
            exit 0
          fi

          {
            printf '💰 **Review cost**: $%s USD\n\n' "$COST"
            printf -- '- Model: `%s`\n' "$MODEL_NAME"
            printf -- '- Prompt tokens: %s\n' "$PROMPT"
            printf -- '- Completion tokens: %s\n' "$COMPLETION"
            printf -- '- Pricing: $%s/1M input · $%s/1M output\n' "$INPUT_PRICE_PER_1M" "$OUTPUT_PRICE_PER_1M"
          } > cost-comment.md

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file cost-comment.md
