name: PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent_job:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    name: Auto-review with pr-agent
    steps:
      - name: PR Agent action step
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Solo habilitamos auto-review; describe e improve quedan apagados.
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          # Secciones que no queremos en el review.
          PR_REVIEWER.REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "false"
          PR_REVIEWER.ENABLE_REVIEW_LABELS_EFFORT: "false"
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "false"
          PR_REVIEWER.REQUIRE_TICKET_ANALYSIS_REVIEW: "false"
          # Clasificación por severidad con emojis (via prompt).
          PR_REVIEWER.NUM_MAX_FINDINGS: "5"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: >-
            Prefix every issue title with a severity emoji:
            🔴 critical — bugs that cause incorrect behavior, crashes,
            data loss, security vulnerabilities, or breaking API changes.
            🟡 medium — likely bugs, edge cases, performance issues,
            or important maintainability problems.
            🟢 low — minor improvements, style, naming, or nits.
            Sort issues from 🔴 to 🟢. Skip 🟢 issues unless there are
            fewer than 3 issues total. Respond in Spanish.
